<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>Music Island</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#070707;color:#f5f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;display:grid;place-items:center;padding:24px}.app{width:min(720px,100%);display:grid;gap:26px;justify-items:center}h1{font-size:clamp(34px,8vw,62px);letter-spacing:-.055em;line-height:.95;margin:0;text-align:center}.sub{margin:10px 0 0;color:#808086;text-align:center;font-size:14px}.stage{width:100%;min-height:210px;border:1px solid rgba(255,255,255,.08);border-radius:30px;display:grid;place-items:center;background:rgba(255,255,255,.018)}.island{width:min(560px,calc(100vw - 64px));height:108px;border-radius:999px;background:#000;display:flex;align-items:center;padding:10px 22px 10px 10px;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.5)}.art{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#555,#111);display:grid;place-items:center;font-size:32px;flex:none}.meta{min-width:0;flex:1}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}.status{font-size:12px;color:#77777d;margin-top:4px}.viz{height:44px;width:82px;display:flex;align-items:center;justify-content:flex-end;gap:4px;flex:none}.bar{width:4px;height:34px;border-radius:99px;background:#9d9da2;transform:scaleY(.15);transform-origin:center;will-change:transform}.dot{width:4px;height:4px;border-radius:50%;background:#808085}.panel{width:min(560px,100%);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:15px;display:grid;gap:12px;background:rgba(255,255,255,.02)}.drop{min-height:96px;border:1px dashed rgba(255,255,255,.16);border-radius:17px;display:grid;place-items:center;text-align:center;color:#bdbdc1;cursor:pointer;padding:16px}.drop strong{color:white}.drop small{display:block;color:#67676c;margin-top:5px}#file{display:none}.load[hidden]{display:none}.loadtop{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#8b8b91;margin-bottom:8px}.loadtop span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.fill{height:100%;width:0;border-radius:inherit;background:rgba(255,255,255,.8);transition:width .1s linear}.transport{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px}.play{width:42px;height:42px;border:0;border-radius:50%;background:#f4f4f5;color:#080808;font-weight:800;cursor:pointer}.play:disabled{opacity:.25}.seek{width:100%;accent-color:#ddd}.time{font-size:12px;color:#68686e;font-variant-numeric:tabular-nums}.privacy{font-size:12px;color:#55555a;text-align:center}@media(max-width:560px){.stage{min-height:190px}.island{height:86px}.art{width:68px;height:68px;border-radius:17px}.meta{display:none}.viz{margin-left:auto}}</style></head><body><main class="app"><header><h1>Upload. Play. Watch.</h1><p class="sub">Le fichier reste sur ton appareil. L’animation réagit réellement au son.</p></header><section class="stage"><div class="island"><div class="art">♫</div><div class="meta"><div class="name" id="name">Aucun morceau</div><div class="status" id="status">Ajoute un fichier audio</div></div><div class="viz"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="dot"></i><i class="dot"></i></div></div></section><section class="panel"><label class="drop" for="file"><span><strong>Choisir un son</strong><small>MP3, M4A, WAV, AAC, OGG, FLAC</small></span></label><input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac,.webm"><div class="load" id="load" hidden aria-live="polite"><div class="loadtop"><span id="loadLabel">Préparation…</span><span id="pct">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></div><div class="transport"><button id="play" class="play" disabled>▶</button><input id="seek" class="seek" type="range" min="0" max="1000" value="0" disabled><span id="time" class="time">0:00 / 0:00</span></div></section><div class="privacy">Aucun upload serveur. La progression correspond à la lecture locale du fichier par le navigateur.</div><audio id="audio" preload="metadata"></audio></main><script>const $=id=>document.getElementById(id),audio=$('audio'),file=$('file'),play=$('play'),seek=$('seek'),time=$('time'),nameEl=$('name'),status=$('status'),load=$('load'),loadLabel=$('loadLabel'),pct=$('pct'),fill=$('fill'),bars=[...document.querySelectorAll('.bar')];let ctx,src,analyser,freq,wave,url,raf=0,seeking=false;const smooth=new Float32Array(6),floor=[.18,.23,.15,.28,.19,.13],bands=[[60,150],[150,330],[330,750],[750,1800],[1800,4800],[4800,12000]],phase=[0,1.2,2.4,3.7,5.1,6.3];function graph(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC;analyser=ctx.createAnalyser();analyser.fftSize=2048;analyser.minDecibels=-92;analyser.maxDecibels=-20;freq=new Uint8Array(analyser.frequencyBinCount);wave=new Uint8Array(analyser.fftSize);src=ctx.createMediaElementSource(audio);src.connect(analyser);analyser.connect(ctx.destination)}}function progress(v,label){v=Math.max(0,Math.min(100,Math.round(v)));load.hidden=false;fill.style.width=v+'%';pct.textContent=v+'%';if(label)loadLabel.textContent=label}function bytes(n){const m=n/1048576;return m<1?Math.round(n/1024)+' Ko':m.toFixed(m<10?1:0)+' Mo'}function fmt(s){if(!Number.isFinite(s))return'0:00';return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0')}function pretty(n){return n.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ')}function read(f){return new Promise((res,rej)=>{const r=new FileReader;r.onprogress=e=>e.lengthComputable&&progress(e.loaded/e.total*100,'Lecture de '+f.name);r.onerror=()=>rej(r.error||new Error('Lecture impossible'));r.onload=()=>res(r.result);r.readAsArrayBuffer(f)})}function mime(ext){return({mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',webm:'audio/webm'})[ext]||'audio/mpeg'}function bin(hz){return Math.max(0,Math.min(analyser.frequencyBinCount-1,Math.round(hz/(ctx.sampleRate/2)*analyser.frequencyBinCount)))}function energy(a,b){let x=bin(a),y=Math.max(x+1,bin(b)),s=0,n=0;for(let i=x;i<=y;i++){let v=freq[i]/255;s+=v*v;n++}return n?Math.sqrt(s/n):0}function rms(){let s=0;for(let i=0;i<wave.length;i++){let x=(wave[i]-128)/128;s+=x*x}return Math.sqrt(s/wave.length)}function animate(now=performance.now()){if(!analyser)return;analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(wave);let global=Math.min(1,rms()*5.5),playing=!audio.paused&&!audio.ended,t=now/1000;bars.forEach((b,i)=>{let sp=Math.pow(Math.min(1,energy(...bands[i])*1.22),.62),target=sp*.72+Math.pow(global,.7)*.28;if(playing)target=target*.93+((Math.sin(t*(4.4+i*.31)+phase[i])+1)/2)*Math.min(.07,global*.09);else target=0;smooth[i]+=(target-smooth[i])*(target>smooth[i]?.42:.105);b.style.transform='scaleY('+Math.min(1,floor[i]+smooth[i]*(1-floor[i])).toFixed(3)+')'});raf=requestAnimationFrame(animate)}async function loadFile(f){const ext=f?.name?.split('.').pop()?.toLowerCase()||'',ok=f&&(((f.type||'').startsWith('audio/'))||['mp3','m4a','wav','aac','ogg','flac','webm'].includes(ext));if(!ok){nameEl.textContent=f?.name||'Fichier non reconnu';status.textContent='Format audio non reconnu';load.hidden=false;loadLabel.textContent='Impossible de lire ce fichier';pct.textContent='Erreur';fill.style.width='0%';file.value='';return}nameEl.textContent=pretty(f.name);status.textContent='Fichier sélectionné · '+bytes(f.size);progress(0,'Ouverture de '+f.name);play.disabled=true;seek.disabled=true;time.textContent='0:00 / 0:00';try{graph();if(ctx.state==='suspended')ctx.resume().catch(()=>{});const buf=await read(f);progress(100,'Fichier lu · préparation audio…');status.textContent='Préparation du lecteur…';if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([buf],{type:f.type||mime(ext)}));audio.src=url;audio.load();await new Promise((res,rej)=>{let done=false,t=setTimeout(()=>{if(!done){done=true;res()}},6000);const ready=()=>{if(done)return;done=true;clearTimeout(t);res()},bad=()=>{if(done)return;done=true;clearTimeout(t);rej(new Error('Le navigateur ne parvient pas à décoder ce fichier'))};audio.addEventListener('loadedmetadata',ready,{once:true});audio.addEventListener('canplay',ready,{once:true});audio.addEventListener('error',bad,{once:true})});play.disabled=false;seek.disabled=false;progress(100,'Prêt · '+f.name);status.textContent='Prêt à jouer · appuie sur ▶';if(!raf)animate();try{if(ctx.state==='suspended')await ctx.resume();await audio.play()}catch(e){status.textContent='Prêt à jouer · appuie sur ▶'}}catch(e){console.error(e);status.textContent='Le chargement a échoué';load.hidden=false;loadLabel.textContent=e.message||'Erreur de chargement';pct.textContent='Erreur';fill.style.width='0%'}finally{file.value=''}}file.addEventListener('change',e=>loadFile(e.target.files[0]));play.addEventListener('click',async()=>{if(!audio.src)return;graph();if(ctx.state==='suspended')await ctx.resume();audio.paused?await audio.play():audio.pause();if(!raf)animate()});audio.addEventListener('play',()=>{play.textContent='Ⅱ';status.textContent='Lecture'});audio.addEventListener('pause',()=>{play.textContent='▶';if(!audio.ended&&audio.src)status.textContent='En pause'});audio.addEventListener('loadedmetadata',()=>{time.textContent='0:00 / '+fmt(audio.duration)});audio.addEventListener('ended',()=>{play.textContent='▶';status.textContent='Terminé';seek.value=1000});audio.addEventListener('timeupdate',()=>{if(!seeking&&audio.duration)seek.value=Math.round(audio.currentTime/audio.duration*1000);time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)});seek.addEventListener('input',()=>{seeking=true;if(audio.duration)time.textContent=fmt(seek.value/1000*audio.duration)+' / '+fmt(audio.duration)});seek.addEventListener('change',()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration;seeking=false});bars.forEach((b,i)=>b.style.transform='scaleY('+floor[i]+')');</script></body></html>
