<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>Music Island</title>
<style>
:root{color-scheme:dark;--bg:#070707;--text:#f5f5f6;--muted:#85858a;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:28px 18px;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% -10%,rgba(255,255,255,.06),transparent 60%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Segoe UI,sans-serif}.app{width:min(760px,100%);display:grid;gap:30px;justify-items:center}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:#77777c;font-size:11px;font-weight:700;text-align:center}h1{margin:8px 0 0;text-align:center;font-size:clamp(34px,7vw,64px);line-height:.98;letter-spacing:-.055em}.sub{max-width:560px;margin:14px auto 0;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}.stage{width:100%;min-height:220px;padding:28px 20px;display:grid;place-items:center;border:1px solid var(--line);border-radius:32px;background:rgba(255,255,255,.018);box-shadow:0 30px 90px rgba(0,0,0,.28)}.island{width:min(560px,calc(100vw - 70px));height:112px;padding:11px 24px 11px 12px;border-radius:999px;background:#000;display:flex;align-items:center;gap:14px;box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.03)}.art{width:88px;height:88px;flex:0 0 auto;border-radius:22px;display:grid;place-items:center;background:radial-gradient(circle at 68% 30%,#eee,rgba(255,255,255,.15) 22%,transparent 24%),radial-gradient(circle at 35% 70%,#aaa,rgba(255,255,255,.05) 30%,transparent 32%),linear-gradient(135deg,#3f3f43,#111 65%)}.art:after{content:"♫";font-size:33px;opacity:.72}.track{min-width:0;flex:1}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:650}.status{margin-top:4px;color:#6f6f74;font-size:12px;white-space:nowrap}.viz{width:74px;height:46px;display:flex;align-items:center;justify-content:center;gap:4px}.bar{width:4px;height:34px;border-radius:999px;background:#9b9b9f;transform-origin:center;transform:scaleY(.16);opacity:.68;will-change:transform,opacity}.dot{width:4px;height:4px;border-radius:50%;background:#818186;opacity:.66}.controls{width:min(560px,100%);padding:16px;display:grid;gap:12px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.025)}.drop{min-height:96px;padding:18px;display:grid;place-items:center;text-align:center;border:1px dashed rgba(255,255,255,.17);border-radius:18px;color:#b7b7bb;cursor:pointer}.drop strong{color:#f2f2f3}.drop small{display:block;margin-top:5px;color:#69696e}.drop.drag{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.35)}input[type=file]{display:none}.feedback{min-height:42px;padding:10px 12px;display:flex;align-items:center;gap:10px;border-radius:14px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.035);color:#909095;font-size:12px;line-height:1.35}.feedback-dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:#55555a}.feedback[data-state=loading]{color:#c0c0c4}.feedback[data-state=loading] .feedback-dot{background:#d0d0d3;animation:pulse 1s ease-in-out infinite}.feedback[data-state=ready]{color:#c9c9cd}.feedback[data-state=ready] .feedback-dot{background:#a7a7ac}.feedback[data-state=error]{color:#ddbaba}.feedback[data-state=error] .feedback-dot{background:#c67e7e}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.82)}50%{opacity:1;transform:scale(1.08)}}.progress{display:none}.progress.show{display:block}.progress-top{margin-bottom:7px;display:flex;justify-content:space-between;gap:12px;color:#85858a;font-size:12px}.progress-top span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.progress-track{height:5px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.07)}.progress-fill{width:0;height:100%;border-radius:inherit;background:rgba(255,255,255,.8);transition:width .12s linear}.transport{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center}.play{width:42px;height:42px;border:0;border-radius:50%;display:grid;place-items:center;background:#f3f3f4;color:#090909;font-size:15px;font-weight:800;cursor:pointer}.play:disabled{opacity:.25;cursor:default}input[type=range]{width:100%;accent-color:#d5d5d7}.time{color:#69696d;font-size:12px;font-variant-numeric:tabular-nums}.privacy{text-align:center;color:#59595e;font-size:12px}@media(max-width:560px){.app{gap:24px}.stage{min-height:190px;border-radius:28px}.island{width:calc(100vw - 56px);height:88px;padding:9px 16px 9px 9px}.art{width:70px;height:70px;border-radius:18px}.art:after{font-size:26px}.track{display:none}.viz{margin-left:auto}}
</style>
</head>
<body>
<main class="app">
<header><div class="eyebrow">Audio reactive island</div><h1>Upload. Play. Watch.</h1><p class="sub">Choisis un morceau. L’animation réagit réellement au son directement dans ton navigateur.</p></header>
<section class="stage"><div class="island"><div class="art"></div><div class="track"><div class="name" id="trackName">Aucun morceau</div><div class="status" id="status">Ajoute un fichier audio</div></div><div class="viz"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div></section>
<section class="controls">
<label class="drop" id="dropzone" for="fileInput"><span><strong>Choisir un son</strong><small>MP3, WAV, M4A, AAC, OGG, FLAC</small></span></label>
<input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.webm">
<div class="feedback" id="feedback" data-state="idle"><span class="feedback-dot"></span><span id="feedbackText">Aucun fichier sélectionné</span></div>
<div class="progress" id="progress"><div class="progress-top"><span id="progressLabel">Lecture du fichier…</span><span id="progressPercent">0%</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
<div class="transport"><button class="play" id="playBtn" disabled>▶</button><input id="seek" type="range" min="0" max="1000" value="0" disabled><div class="time" id="time">0:00 / 0:00</div></div>
</section>
<div class="privacy">Le fichier reste sur ton appareil. Aucun upload serveur.</div>
<audio id="audio" preload="metadata"></audio>
</main>
<script>
const audio=document.getElementById('audio'),input=document.getElementById('fileInput'),drop=document.getElementById('dropzone'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),timeEl=document.getElementById('time'),trackName=document.getElementById('trackName'),statusEl=document.getElementById('status'),feedback=document.getElementById('feedback'),feedbackText=document.getElementById('feedbackText'),progress=document.getElementById('progress'),progressFill=document.getElementById('progressFill'),progressLabel=document.getElementById('progressLabel'),progressPercent=document.getElementById('progressPercent'),bars=[...document.querySelectorAll('.bar')];
let ctx,source,analyser,freq,timeData,raf=0,objectUrl=null,seeking=false,loadId=0;
const smooth=new Float32Array(6),floors=[.18,.23,.15,.28,.19,.13],phases=[0,1.2,2.4,3.7,5.1,6.3],bands=[[60,150],[150,330],[330,750],[750,1800],[1800,4800],[4800,12000]];
function setFeedback(state,text){feedback.dataset.state=state;feedbackText.textContent=text}
function setProgress(p,label){const v=Math.max(0,Math.min(100,Math.round(p)));progress.classList.add('show');progressFill.style.width=v+'%';progressPercent.textContent=v+'%';if(label)progressLabel.textContent=label}
function hideProgress(){setTimeout(()=>progress.classList.remove('show'),450)}
function formatBytes(n){if(!Number.isFinite(n))return'';return n<1048576?Math.max(1,Math.round(n/1024))+' Ko':(n/1048576).toFixed(n<10485760?1:0)+' Mo'}
function formatTime(s){if(!Number.isFinite(s))return'0:00';return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0')}
function prettyName(n){return n.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim()}
function mimeFor(ext){return({mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',webm:'audio/webm'})[ext]||'audio/mpeg'}
function ensureGraph(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Web Audio indisponible');ctx=new AC();analyser=ctx.createAnalyser();analyser.fftSize=2048;analyser.minDecibels=-92;analyser.maxDecibels=-20;analyser.smoothingTimeConstant=.18;freq=new Uint8Array(analyser.frequencyBinCount);timeData=new Uint8Array(analyser.fftSize)}if(!source){source=ctx.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ctx.destination)}}
function hzToBin(hz){const nyq=ctx.sampleRate/2;return Math.max(0,Math.min(analyser.frequencyBinCount-1,Math.round(hz/nyq*analyser.frequencyBinCount)))}
function bandEnergy(lo,hi){const a=hzToBin(lo),b=Math.max(a+1,hzToBin(hi));let s=0,n=0;for(let i=a;i<=b;i++){const v=freq[i]/255;s+=v*v;n++}return n?Math.sqrt(s/n):0}
function rms(){let s=0;for(let i=0;i<timeData.length;i++){const x=(timeData[i]-128)/128;s+=x*x}return Math.sqrt(s/timeData.length)}
function animate(now=performance.now()){if(!analyser)return;analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(timeData);const global=Math.min(1,rms()*5.5),playing=!audio.paused&&!audio.ended,t=now*.001;for(let i=0;i<6;i++){let spectral=Math.pow(Math.min(1,bandEnergy(...bands[i])*1.22),.62),target=spectral*.72+Math.pow(global,.7)*.28;if(playing){const organic=(Math.sin(t*(4.4+i*.31)+phases[i])+1)*.5;target=target*.93+organic*Math.min(.07,global*.09)}else target=0;smooth[i]+=(target-smooth[i])*(target>smooth[i]?.42:.105);const scale=Math.min(1,floors[i]+smooth[i]*(1-floors[i]));bars[i].style.transform=`scaleY(${scale.toFixed(3)})`;bars[i].style.opacity=.58+Math.min(.38,smooth[i]*.46)}raf=requestAnimationFrame(animate)}
function readWithProgress(file,id){return new Promise((resolve,reject)=>{const r=new FileReader();r.onprogress=e=>{if(id!==loadId)return;if(e.lengthComputable)setProgress(e.loaded/e.total*100,'Lecture de '+file.name);else setFeedback('loading','Lecture du fichier…')};r.onerror=()=>reject(r.error||new Error('Lecture impossible'));r.onabort=()=>reject(new Error('Lecture annulée'));r.onload=()=>resolve(r.result);r.readAsArrayBuffer(file)})}
async function loadFile(file){const id=++loadId;if(!file){setFeedback('idle','Aucun fichier sélectionné');return}const ext=(file.name.split('.').pop()||'').toLowerCase(),ok=file.type.startsWith('audio/')||['mp3','m4a','aac','wav','ogg','flac','webm'].includes(ext);trackName.textContent=prettyName(file.name)||'Audio';statusEl.textContent='Fichier sélectionné';setFeedback('loading',`Fichier détecté • ${formatBytes(file.size)} • lecture locale…`);setProgress(0,'Préparation de '+file.name);playBtn.disabled=true;seek.disabled=true;seek.value=0;timeEl.textContent='0:00 / 0:00';if(!ok){setFeedback('error','Ce fichier n’est pas reconnu comme audio.');progress.classList.remove('show');return}try{audio.pause();const buffer=await readWithProgress(file,id);if(id!==loadId)return;setProgress(100,'Fichier lu • décodage audio…');if(objectUrl)URL.revokeObjectURL(objectUrl);const blob=new Blob([buffer],{type:file.type&&file.type.startsWith('audio/')?file.type:mimeFor(ext)});objectUrl=URL.createObjectURL(blob);audio.src=objectUrl;audio.load();setFeedback('loading','Fichier lu à 100% • le navigateur décode maintenant le son…');setTimeout(()=>{if(id===loadId&&audio.readyState<1)setFeedback('loading','Toujours en décodage… ce n’est plus le chargement du fichier.')},2500);setTimeout(()=>{if(id===loadId&&audio.readyState<1)setFeedback('error','Ça semble bloqué au décodage. Essaie un autre MP3 ou ouvre la page directement dans Safari.')},8000)}catch(err){console.error(err);statusEl.textContent='Erreur';setFeedback('error','Impossible de lire ce fichier • '+(err.message||'erreur inconnue'));progress.classList.remove('show')}finally{input.value=''}}
input.addEventListener('change',e=>loadFile(e.target.files[0]));['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
playBtn.addEventListener('click',async()=>{if(!audio.src)return;if(!audio.paused){audio.pause();return}statusEl.textContent='Démarrage…';setFeedback('loading','Initialisation de l’analyse audio…');try{ensureGraph();if(ctx.state==='suspended')await ctx.resume();await audio.play();if(!raf)animate()}catch(err){console.error(err);statusEl.textContent='Erreur au démarrage';setFeedback('error','Impossible de démarrer • '+(err.message||'erreur inconnue'))}});
audio.addEventListener('loadstart',()=>{statusEl.textContent='Décodage…'});audio.addEventListener('loadedmetadata',()=>{statusEl.textContent='Métadonnées chargées';timeEl.textContent=`0:00 / ${formatTime(audio.duration)}`;setFeedback('loading',`Son reconnu • ${formatTime(audio.duration)} • préparation de la lecture…`)});audio.addEventListener('canplay',()=>{playBtn.disabled=false;seek.disabled=false;statusEl.textContent='Prêt à jouer';setFeedback('ready',`Prêt • ${formatTime(audio.duration)} • appuie sur ▶`);hideProgress()});audio.addEventListener('play',()=>{playBtn.textContent='Ⅱ';statusEl.textContent='Lecture';setFeedback('ready','Lecture en cours • analyse temps réel active')});audio.addEventListener('pause',()=>{playBtn.textContent='▶';if(audio.currentTime>0&&!audio.ended){statusEl.textContent='En pause';setFeedback('ready',`En pause • ${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`)}});audio.addEventListener('waiting',()=>{if(!audio.paused)setFeedback('loading','Le navigateur prépare la suite du morceau…')});audio.addEventListener('stalled',()=>setFeedback('loading','Le décodage prend plus de temps que prévu…'));audio.addEventListener('ended',()=>{playBtn.textContent='▶';seek.value=1000;statusEl.textContent='Terminé';setFeedback('ready','Lecture terminée • tu peux relancer le morceau')});audio.addEventListener('error',()=>{const code=audio.error?.code,reason=({1:'lecture interrompue',2:'erreur réseau',3:'erreur de décodage',4:'format non pris en charge'})[code]||'erreur inconnue';statusEl.textContent='Impossible à lire';setFeedback('error','Le navigateur refuse ce fichier • '+reason);playBtn.disabled=true});audio.addEventListener('timeupdate',()=>{if(!seeking&&Number.isFinite(audio.duration)&&audio.duration>0)seek.value=Math.round(audio.currentTime/audio.duration*1000);timeEl.textContent=`${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`});seek.addEventListener('input',()=>{seeking=true;if(Number.isFinite(audio.duration)){const v=seek.value/1000*audio.duration;timeEl.textContent=`${formatTime(v)} / ${formatTime(audio.duration)}`}});seek.addEventListener('change',()=>{if(Number.isFinite(audio.duration))audio.currentTime=seek.value/1000*audio.duration;seeking=false});
</script>
</body>
</html>
